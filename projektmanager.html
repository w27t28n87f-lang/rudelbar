<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rudelbar Projektmanager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><style>
:root{color-scheme:dark;font-family:system-ui,Arial}*{box-sizing:border-box}body{margin:0;background:#0d1119;color:#f4f6fb}header{padding:22px;background:#151d2b;border-bottom:1px solid #30394b}main{max-width:1180px;margin:auto;padding:18px}.top,.toolbar,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between}h1{margin:0;font-size:1.7rem}h2{font-size:1.15rem}small,.muted{color:#a6b0c1}button,input,select,textarea{font:inherit;border-radius:10px;border:1px solid #3c475b;padding:11px;background:#202b3b;color:white}button{cursor:pointer}button.primary{background:#d49a3b;color:#17120b;font-weight:750;border:0}button:disabled{opacity:.5}input,select,textarea{width:100%}label{display:grid;gap:6px;font-size:.9rem}textarea{min-height:80px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #30394b;background:#171f2c;border-radius:16px;padding:16px}.stat strong{font-size:1.9rem;display:block} .tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button.active{background:#d49a3b;color:#17120b}.project{cursor:pointer}.project:hover{border-color:#d49a3b}.pill{font-size:.78rem;padding:4px 8px;border-radius:20px;background:#344155}progress{width:100%;accent-color:#d49a3b}dialog{width:min(620px,95vw);max-height:90vh;overflow:auto;border:1px solid #47546a;border-radius:18px;background:#171f2c;color:white;padding:22px}dialog::backdrop{background:#000b}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}.full{grid-column:1/-1}.listitem{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px;border-bottom:1px solid #354053}.listitem:last-child{border:0}.notice{padding:12px;border:1px solid #7d6543;border-radius:10px;margin:12px 0}.hidden{display:none!important}@media(max-width:600px){header{padding:15px}main{padding:12px}.top{align-items:flex-start}h1{font-size:1.35rem}}
</style></head><body><header><div class="top"><div><small>RUDELBAR · PROJEKTZENTRALE</small><h1>🐺 Projekte & Events</h1></div><div id="identity" class="muted">Anmeldung prüfen …</div></div></header><main><div id="status" class="notice">Verbinde mit Supabase …</div><section id="app" class="hidden"><div class="grid" id="stats"></div><div class="toolbar" style="margin-top:20px"><button class="primary" id="newProject">+ Neues Projekt</button><input id="search" placeholder="Projekte und Aufgaben suchen" style="flex:1;min-width:180px"><select id="filter" style="max-width:180px"><option value="all">Alle Status</option><option value="planung">Planung</option><option value="aktiv">Aktiv</option><option value="pausiert">Pausiert</option><option value="fertig">Abgeschlossen</option></select></div><div class="tabs"><button data-tab="all" class="active">Alle Projekte</button><button data-tab="event">🎪 Events</button><button data-tab="firma">🏢 Unternehmen</button><button data-tab="tasks">☑ Aufgaben</button></div><section id="content"></section></section></main>
<dialog id="projectDialog"><form id="projectForm"><h2 id="projectHeading">Projekt</h2><input type="hidden" name="id"><div class="formgrid"><label>Bereich<select name="kind"><option value="event">Event</option><option value="firma">Unternehmen</option></select></label><label>Status<select name="status"><option value="planung">Planung</option><option value="aktiv">Aktiv</option><option value="pausiert">Pausiert</option><option value="fertig">Abgeschlossen</option></select></label><label class="full">Projektname<input name="title" required maxlength="180"></label><label class="full">Beschreibung<textarea name="description"></textarea></label><label>Startdatum<input type="date" name="start_date"></label><label>Enddatum / Eventtag<input type="date" name="due_date"></label><label>Budget (€)<input type="number" name="budget" min="0" step="0.01"></label><label>Verantwortliche Person<input name="owner_name"></label><label class="full">Ort / Veranstaltungsort<input name="location"></label><label class="full">Kontakt / Veranstalter<input name="contact"></label></div><div class="actions"><button class="primary" type="submit">Projekt speichern</button><button type="button" data-close="projectDialog">Abbrechen</button></div></form></dialog>
<dialog id="detailDialog"><h2 id="detailTitle"></h2><p id="detailInfo" class="muted"></p><div class="actions"><button id="editProject">Bearbeiten</button><button id="newTask" class="primary">+ Aufgabe</button><button id="exportProject">CSV exportieren</button><button data-close="detailDialog">Schließen</button></div><h2>Aufgaben & Meilensteine</h2><div id="taskList"></div><h2>Notizen / Projektprotokoll</h2><div id="noteList"></div><form id="noteForm" class="toolbar"><input id="noteText" placeholder="Neue Notiz oder Entscheidung" required style="flex:1"><button class="primary">Hinzufügen</button></form></dialog>
<dialog id="taskDialog"><form id="taskForm"><h2>Aufgabe</h2><input type="hidden" name="id"><div class="formgrid"><label class="full">Aufgabe<input name="title" required></label><label>Status<select name="status"><option value="offen">Offen</option><option value="in_arbeit">In Arbeit</option><option value="erledigt">Erledigt</option></select></label><label>Priorität<select name="priority"><option value="normal">Normal</option><option value="hoch">Hoch</option><option value="kritisch">Kritisch</option></select></label><label>Fällig am<input type="date" name="due_date"></label><label>Zuständig<input name="assignee"></label><label class="full">Beschreibung / Checkliste<textarea name="description"></textarea></label></div><div class="actions"><button class="primary">Speichern</button><button type="button" data-close="taskDialog">Abbrechen</button></div></form></dialog>
<script src="projektmanager.js?v=20261022b"></script></body></html>
