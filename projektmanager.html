<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rudelbar Projektmanager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><style>
:root{color-scheme:dark;font-family:system-ui,Arial}*{box-sizing:border-box}body{margin:0;background:#0d1119;color:#f4f6fb}header{padding:22px;background:#151d2b;border-bottom:1px solid #30394b}main{max-width:1180px;margin:auto;padding:18px}.top,.toolbar,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between}h1{margin:0;font-size:1.7rem}h2{font-size:1.15rem}small,.muted{color:#a6b0c1}button,input,select,textarea{font:inherit;border-radius:10px;border:1px solid #3c475b;padding:11px;background:#202b3b;color:white}button{cursor:pointer}button.primary{background:#d49a3b;color:#17120b;font-weight:750;border:0}button:disabled{opacity:.5}input,select,textarea{width:100%}label{display:grid;gap:6px;font-size:.9rem}textarea{min-height:80px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #30394b;background:#171f2c;border-radius:16px;padding:16px}.stat strong{font-size:1.9rem;display:block} .tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button.active{background:#d49a3b;color:#17120b}.project{cursor:pointer}.project:hover{border-color:#d49a3b}.pill{font-size:.78rem;padding:4px 8px;border-radius:20px;background:#344155}progress{width:100%;accent-color:#d49a3b}dialog{width:min(620px,95vw);max-height:90vh;overflow:auto;border:1px solid #47546a;border-radius:18px;background:#171f2c;color:white;padding:22px}dialog::backdrop{background:#000b}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}.full{grid-column:1/-1}.listitem{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px;border-bottom:1px solid #354053}.listitem:last-child{border:0}.data-table{border-collapse:collapse;width:100%;min-width:670px}.data-table th,.data-table td{padding:12px 10px;border-bottom:1px solid #354053;text-align:left}.data-table th{color:#a6b0c1;font-size:.85rem}.data-table button{padding:7px 10px}.notice{padding:12px;border:1px solid #7d6543;border-radius:10px;margin:12px 0}.hidden{display:none!important}@media(max-width:600px){header{padding:15px}main{padding:12px}.top{align-items:flex-start}h1{font-size:1.35rem}}
 .stat{cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;transition:border-color .15s,background .15s}.stat:hover,.stat:focus-visible{border-color:#d49a3b}.stat.active-stat{border-color:#d49a3b;background:#29291f}.stats-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:12px}.stat strong{font-size:1.6rem}.tabs{flex-wrap:wrap;overflow:visible}.tabs button{flex:1 1 42%;padding:10px 8px}.toolbar{gap:8px}.toolbar .primary{flex:1 1 43%;font-size:.92rem;padding:10px 7px}.data-table{min-width:0;font-size:.82rem}.data-table th,.data-table td{padding:8px 5px}.data-table th:nth-child(3),.data-table td:nth-child(3){display:none}} </style></head><body><header><div class="top"><div><small>RUDELBAR · PROJEKTZENTRALE</small><h1>🐺 Projekte & Events</h1></div><div id="identity" class="muted">Anmeldung prüfen …</div></div></header><main><div id="status" class="notice">Verbinde mit Supabase …</div><section id="app" class="hidden"><div class="grid stats-grid" id="stats"></div><div class="toolbar" style="margin-top:20px"><button class="primary" id="newProject">+ Neues Projekt</button><button class="primary" id="newInquiry">+ Anfrage erfassen</button><input id="search" placeholder="Projekte und Aufgaben suchen" style="flex:1;min-width:180px"><select id="filter" style="max-width:180px"><option value="all">Alle Status</option><option value="planung">Planung</option><option value="aktiv">Aktiv</option><option value="pausiert">Pausiert</option><option value="fertig">Abgeschlossen</option></select></div><div class="tabs"><button data-tab="all" class="active">Alle Einträge</button><button data-tab="event">🎪 Events</button><button data-tab="firma">📁 Projekte</button><button data-tab="tasks">☑ Aufgaben</button><button data-tab="inquiries">📩 Anfragen</button></div><section id="content"></section><section class="card" style="margin-top:20px"><div class="top"><h2>Listenansicht · Anfragen & Projekte</h2><select id="listSort" style="max-width:190px"><option value="date">Termin (aufsteigend)</option><option value="recent">Zuletzt erfasst</option><option value="title">Name A–Z</option></select></div><div id="listView" style="overflow-x:auto"></div></section></section></main>
<dialog id="inquiryDialog"><form id="inquiryForm"><h2 id="inquiryHeading">Anfrage erfassen</h2><input type="hidden" name="id"><div class="formgrid"><label class="full">Veranstaltung / Betreff<input name="title" required maxlength="180"></label><label>Status<select name="status"><option value="neu">Neue Anfrage</option><option value="bearbeitung">In Bearbeitung</option><option value="angebot">Angebot versendet</option><option value="zusage">Zusage erhalten</option><option value="abgesagt">Abgesagt</option></select></label><label>Veranstaltungsdatum<input name="event_date" type="date"></label><label>Veranstalter<input name="organizer"></label><label>Ansprechpartner<input name="contact_name"></label><label>E-Mail<input name="email" type="email"></label><label>Telefon<input name="phone" type="tel"></label><label class="full">Veranstaltungsort<input name="location"></label><label>Besucherzahl (geschätzt)<input name="visitors" type="number" min="0"></label><label class="full">Angefragte Leistungen<textarea name="services"></textarea></label><label class="full">Notizen / Kommentare<textarea name="notes"></textarea></label></div><div class="actions"><button class="primary">Anfrage speichern</button><button type="button" data-close="inquiryDialog">Abbrechen</button></div></form></dialog><dialog id="projectDialog"><form id="projectForm"><h2 id="projectHeading">Projekt</h2><input type="hidden" name="id"><div class="formgrid"><label>Bereich<select name="kind"><option value="event">Event</option><option value="firma">Projekte</option></select></label><label>Status<select name="status"><option value="planung">Planung</option><option value="aktiv">Aktiv</option><option value="pausiert">Pausiert</option><option value="fertig">Abgeschlossen</option></select></label><label class="full">Projektname<input name="title" required maxlength="180"></label><label class="full">Beschreibung<textarea name="description"></textarea></label><label>Startdatum<input type="date" name="start_date"></label><label>Enddatum / Eventtag<input type="date" name="due_date"></label><label>Budget (€)<input type="number" name="budget" min="0" step="0.01"></label><label>Verantwortliche Person<input name="owner_name"></label><label class="full">Ort / Veranstaltungsort<input name="location"></label><label class="full">Kontakt / Veranstalter<input name="contact"></label></div><div class="actions"><button class="primary" type="submit">Projekt speichern</button><button type="button" data-close="projectDialog">Abbrechen</button></div></form></dialog>
<dialog id="detailDialog"><h2 id="detailTitle"></h2><p id="detailInfo" class="muted"></p><div class="actions"><button id="editProject">Bearbeiten</button><button id="newTask" class="primary">+ Aufgabe</button><button id="exportProject">CSV exportieren</button><button data-close="detailDialog">Schließen</button></div><h2>Aufgaben & Meilensteine</h2><div id="taskList"></div><h2>Notizen / Projektprotokoll</h2><div id="noteList"></div><form id="noteForm" class="toolbar"><input id="noteText" placeholder="Neue Notiz oder Entscheidung" required style="flex:1"><button class="primary">Hinzufügen</button></form></dialog>
<dialog id="taskDialog"><form id="taskForm"><h2>Aufgabe</h2><input type="hidden" name="id"><div class="formgrid"><label class="full">Aufgabe<input name="title" required></label><label>Status<select name="status"><option value="offen">Offen</option><option value="in_arbeit">In Arbeit</option><option value="erledigt">Erledigt</option></select></label><label>Priorität<select name="priority"><option value="normal">Normal</option><option value="hoch">Hoch</option><option value="kritisch">Kritisch</option></select></label><label>Fällig am<input type="date" name="due_date"></label><label>Zuständig<input name="assignee"></label><label class="full">Beschreibung / Checkliste<textarea name="description"></textarea></label></div><div class="actions"><button class="primary">Speichern</button><button type="button" data-close="taskDialog">Abbrechen</button></div></form></dialog>
<script src="projektmanager.js?v=20261022d"></script></body></html>
