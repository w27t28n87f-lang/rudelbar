<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>Rudelbar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <header class="kopf">
      <div class="branding">
        <img src="rudelbar-icon.png" class="logo" alt="Rudelbar">

        <div>
          <h1>RUDELBAR</h1>
          <p>DIE MOBILE KNEIPE</p>
        </div>
      </div>

      <div class="kopf-buttons">
        <button class="iconbutton" id="statistikBtn" aria-label="Übersicht">
          <svg viewBox="0 0 24 24">
            <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
          </svg>
        </button>

        <button class="hauptbutton" id="getraenkHinzufuegen">
          + Getränk
        </button>
      </div>
    </header>

    <section class="inhalt">

      <section class="produkte">
        <div id="getraenkeListe" class="getraenke-grid"></div>
      </section>

      <aside class="bestellung">
        <h2>Bestellung</h2>

        <div id="warenkorb" class="warenkorb"></div>

        <div class="gesamt-zeile">
          <strong>GESAMT</strong>
          <strong id="gesamtpreis">0,00 €</strong>
        </div>

        <div class="zahlung">
          <button id="barButton" class="zahlung-button bar">
            BAR
          </button>

          <button id="karteButton" class="zahlung-button karte">
            KARTE
          </button>
        </div>

        <button id="bestellungLoeschen" class="loeschen-button">
          Bestellung löschen
        </button>
      </aside>

    </section>
  </main>

  <!-- Getränk -->

  <dialog id="getraenkDialog">
    <div class="dialogbox">
      <div class="dialog-kopf">
        <h2 id="dialogTitel">Getränk hinzufügen</h2>
        <button class="sekundaer" id="getraenkAbbrechen">Abbrechen</button>
      </div>

      <label>
        Name
        <input id="nameInput" autocomplete="off">
      </label>

      <label>
        Preis
        <input id="preisInput" inputmode="decimal" placeholder="3,50">
      </label>

      <label>
        Foto
        <input id="bildInput" type="file" accept="image/*">
      </label>

      <div id="bildVorschau" class="bild-vorschau"></div>

      <button class="hauptbutton voll" id="getraenkSpeichern">
        Speichern
      </button>
    </div>
  </dialog>

  <!-- Übersicht -->

  <dialog id="statistikDialog">
    <div class="dialogbox gross">
      <div class="dialog-kopf">
        <h2>Tagesübersicht</h2>

        <div class="dialog-aktionen">
          <button class="teilenBtn" id="getraenkeTeilen">
            Teilen
          </button>

          <button class="sekundaer" id="statistikSchliessen">
            Fertig
          </button>
        </div>
      </div>

      <div id="statistikInhalt"></div>
    </div>
  </dialog>

  <!-- Tagesabschluss -->

  <dialog id="abschlussDialog">
    <div class="dialogbox gross">
      <div class="dialog-kopf">
        <h2>Tagesabschluss</h2>

        <div class="dialog-aktionen">
          <button class="teilenBtn" id="abschlussTeilen">
            Teilen
          </button>

          <button class="sekundaer" id="abschlussSchliessen">
            Fertig
          </button>
        </div>
      </div>

      <div class="abschluss-form">
        <label>
          Veranstaltung
          <input id="veranstaltungInput" placeholder="z. B. Dorffest">
        </label>

        <label>
          Anfangsbestand
          <input id="anfangsbestandInput" inputmode="decimal" value="0">
        </label>

        <label>
          Einlagen
          <input id="einlagenInput" inputmode="decimal" value="0">
        </label>

        <label>
          Entnahmen
          <input id="entnahmenInput" inputmode="decimal" value="0">
        </label>

        <label>
          Ausgaben
          <input id="ausgabenInput" inputmode="decimal" value="0">
        </label>

        <label>
          Ist-Kassenbestand
          <input id="istKasseInput" inputmode="decimal" value="0">
        </label>
      </div>

      <div id="abschlussInhalt"></div>

      <button class="hauptbutton voll" id="abschlussSpeichern">
        Tagesabschluss speichern
      </button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
